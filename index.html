<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Маленькие Волшебники</title>
    <style>
        /* Здесь будет наш дизайн (тёмное фэнтези) */
        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 10px;
            text-align: center;
        }
        #top-panel {
            display: flex;
            justify-content: space-between;
            background: #2a2a2a;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #444;
        }
        #map {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 2px;
            background: #333;
            padding: 5px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .cell {
            aspect-ratio: 1;
            background: #222;
            border: 1px solid #444;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
        }
        #bottom-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }
        button {
            background: #3a2a4a;
            color: #fff;
            border: 1px solid #5a4a6a;
            padding: 10px;
            border-radius: 5px;
            font-family: inherit;
            cursor: pointer;
        }
        button:active {
            background: #5a4a6a;
        }
    </style>
</head>
<body>
    <!-- Верхняя панель -->
    <div id="top-panel">
        <span id="player-name">Игрок</span>
        <span id="player-level">Ур. 1</span>
        <span id="player-hp">10/10 HP</span>
        <span id="player-tickets">🎫 0</span>
        <span id="player-crystals">💎 0</span>
    </div>

    <!-- Карта -->
    <div id="map"></div>

    <!-- Нижняя панель -->
    <div id="bottom-panel">
        <button onclick="showInventory()">Инвентарь</button>
        <button onclick="showQuests()">Задания</button>
        <button onclick="refreshGame()">Обновить</button>
        <button onclick="showMenu()">В игру</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
