<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Маленькие Волшебники</title>
    <style>
        /* --- СТИЛИ (Тёмное фэнтези) --- */
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 10px;
            text-align: center;
            user-select: none;
        }

        #top-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2a2a2a;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #444;
            font-size: 13px;
            font-weight: bold;
            flex-wrap: wrap;
            gap: 5px;
        }

        #map {
            display: grid;
            grid-template-columns: repeat(30, 1fr);
            gap: 1px;
            background: #000;
            padding: 4px;
            border-radius: 8px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
            /* Прокрутка по горизонтали для мобильных */
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border: 2px solid #333;
        }

        .cell {
            aspect-ratio: 1;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #666;
            cursor: pointer;
            /* Минимальный размер, чтобы клетки не сжимались в точку */
            min-width: 16px;
            min-height: 16px;
        }

        /* Подсветка при наведении (для ПК) */
        .cell:hover {
            background: #333;
        }

        /* Подсветка при нажатии (для мобильных) */
        .cell:active {
            background: #555;
        }

        #bottom-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            max-width: 500px;
            margin: 0 auto;
        }

        button {
            background: #2e1e3e;
            color: #f0f0f0;
            border: 1px solid #6a4a8a;
            padding: 12px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:active {
            background: #5a4a6a;
        }
    </style>
</head>
<body>

    <!-- Верхняя панель (Статы) -->
    <div id="top-panel">
        <span id="player-name">Загрузка...</span>
        <span id="player-level">Ур. 1</span>
        <span id="player-hp">10/10 HP</span>
        <span id="player-tickets">🎫 0</span>
        <span id="player-crystals">💎 0</span>
    </div>

    <!-- Игровая карта -->
    <div id="map"></div>

    <!-- Кнопки управления -->
    <div id="bottom-panel">
        <button onclick="showInventory()">Инвентарь</button>
        <button onclick="showQuests()">Задания</button>
        <button onclick="refreshGame()">Обновить</button>
        <button onclick="showMenu()">В игру</button>
    </div>

    <!-- Подключение Firebase и запуск игры -->
    <script type="module">
        // Импортируем все нужные функции из Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Настройки твоего проекта Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAaA67URrVAeCBHQGVKxcTHd65ggnwOStU",
            authDomain: "magic-duo.firebaseapp.com",
            databaseURL: "https://magic-duo-default-rtdb.firebaseio.com",
            projectId: "magic-duo",
            storageBucket: "magic-duo.firebasestorage.app",
            messagingSenderId: "194532347648",
            appId: "1:194532347648:web:48542437a83b225045ede5"
        };

        // Инициализация Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Передаем функции в глобальную область, чтобы файл script.js их видел
        window.gameDB = { db, ref, set, onValue, update, get };
        
        // Подгружаем основной скрипт игры после инициализации Firebase
        const script = document.createElement('script');
        script.src = 'script.js';
        document.body.appendChild(script);
    </script>
</body>
</html>
