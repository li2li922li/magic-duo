<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Маленькие Волшебники</title>
    <style>
        /* Тёмное фэнтези */
        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 10px;
            text-align: center;
            user-select: none;
        }
        #top-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2a2a2a;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #444;
            font-size: 14px;
        }
        #map {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 2px;
            background: #333;
            padding: 5px;
            border-radius: 8px;
            margin-bottom: 10px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        .cell {
            aspect-ratio: 1;
            background: #222;
            border: 1px solid #444;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #888;
            cursor: pointer;
        }
        .cell:active {
            background: #444;
        }
        #bottom-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            max-width: 500px;
            margin: 0 auto;
        }
        button {
            background: #3a2a4a;
            color: #fff;
            border: 1px solid #5a4a6a;
            padding: 12px;
            border-radius: 5px;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
        }
        button:active {
            background: #5a4a6a;
        }
    </style>
</head>
<body>
    <!-- Верхняя панель -->
    <div id="top-panel">
        <span id="player-name">Игрок</span>
        <span id="player-level">Ур. 1</span>
        <span id="player-hp">10/10 HP</span>
        <span id="player-tickets">🎫 0</span>
        <span id="player-crystals">💎 0</span>
    </div>

    <!-- Карта -->
    <div id="map"></div>

    <!-- Нижняя панель -->
    <div id="bottom-panel">
        <button onclick="showInventory()">Инвентарь</button>
        <button onclick="showQuests()">Задания</button>
        <button onclick="refreshGame()">Обновить</button>
        <button onclick="showMenu()">В игру</button>
    </div>

    <!-- Подключение Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAaA67URrVAeCBHQGVKxcTHd65ggnwOStU",
            authDomain: "magic-duo.firebaseapp.com",
            databaseURL: "https://magic-duo-default-rtdb.firebaseio.com",
            projectId: "magic-duo",
            storageBucket: "magic-duo.firebasestorage.app",
            messagingSenderId: "194532347648",
            appId: "1:194532347648:web:48542437a83b225045ede5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Передаем функции в глобальную область, чтобы script.js их видел
        window.gameDB = { db, ref, set, onValue, update };
        
        // Запускаем основной скрипт после загрузки Firebase
        const script = document.createElement('script');
        script.src = 'script.js';
        document.body.appendChild(script);
    </script>
</body>
</html>
