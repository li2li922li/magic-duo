<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Маленькие Волшебники</title>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'Courier New', Courier, monospace; margin: 0; padding: 10px; text-align: center; user-select: none; }
        #top-panel { display: flex; justify-content: space-between; align-items: center; background: #2a2a2a; padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #444; font-size: 13px; font-weight: bold; flex-wrap: wrap; gap: 5px; }
        #map { display: grid; grid-template-columns: repeat(30, 1fr); gap: 1px; background: #000; padding: 4px; border-radius: 8px; margin-bottom: 15px; width: 100%; max-width: 900px; margin-left: auto; margin-right: auto; overflow-x: auto; -webkit-overflow-scrolling: touch; border: 2px solid #333; }
        .cell { aspect-ratio: 1; background: #1a1a1a; border: 1px solid #2a2a2a; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #666; cursor: pointer; min-width: 16px; min-height: 16px; }
        .cell:hover { background: #333; } .cell:active { background: #555; }
        
        #bottom-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; max-width: 600px; margin: 0 auto; }
        button { background: #2e1e3e; color: #f0f0f0; border: 1px solid #6a4a8a; padding: 10px; border-radius: 6px; font-family: inherit; font-size: 12px; font-weight: bold; cursor: pointer; }
        button:active { background: #5a4a6a; }

        /* --- СТИЛИ ДЛЯ ОКОН --- */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: #1e1e24; border: 2px solid #6a4a8a; border-radius: 10px; padding: 20px; width: 90%; max-width: 400px; text-align: left; box-shadow: 0 0 20px rgba(106, 74, 138, 0.5); max-height: 80vh; overflow-y: auto; }
        .modal-content h2 { margin-top: 0; color: #ffcc00; text-align: center; font-size: 20px; }
        
        .monster-stats { color: #ff6b6b; font-weight: bold; font-size: 16px; margin-bottom: 10px; text-align: center; }
        .monster-desc { font-size: 13px; color: #aaa; margin-bottom: 15px; font-style: italic; }
        .battle-log { background: #000; color: #fff; padding: 10px; border-radius: 5px; height: 80px; overflow-y: auto; font-size: 12px; margin-bottom: 15px; border: 1px solid #333; }
        .battle-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
        .battle-btn { background: #333; border: 1px solid #555; font-size: 12px; padding: 8px; }
        .close-btn { grid-column: span 2; background: #6a2a2a; border-color: #8a4a4a; margin-top: 5px; }

        .inv-item { background: #2a2a2a; border: 1px solid #444; padding: 10px; margin-bottom: 5px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .shop-btn { padding: 5px 10px; font-size: 12px; background: #4a6a4a; border: none; }

        .avatar-select { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 15px 0; }
        .avatar-option { font-size: 24px; padding: 10px; background: #2a2a2a; border-radius: 8px; cursor: pointer; border: 2px solid transparent; }
        .avatar-option.selected { border-color: #ffcc00; background: #3a3a1a; }
        .xp-bar-container { background: #000; border-radius: 10px; height: 20px; width: 100%; margin: 10px 0; overflow: hidden; position: relative; border: 1px solid #444; }
        .xp-bar-fill { background: #4a8a6a; height: 100%; width: 0%; transition: width 0.3s; }
        .xp-text { position: absolute; width: 100%; text-align: center; top: 2px; font-size: 12px; font-weight: bold; color: #fff; text-shadow: 1px 1px 0 #000; }
        
        /* Стили для квестов */
        .quest-item { background: #2a2a2a; border: 1px solid #444; padding: 10px; margin-bottom: 5px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
    </style>
</head>
<body>

    <div id="top-panel">
        <span id="player-name">Загрузка...</span>
        <span id="player-level">Ур. 1/50</span>
        <span id="player-hp">10/10 HP</span>
        <span id="player-tickets">🎫 0</span>
        <span id="player-crystals">💎 0</span>
    </div>

    <div id="map"></div>

    <div id="bottom-panel">
        <button onclick="showInventory()">🎒 Инвентарь</button>
        <button onclick="showCharacter()">🧙‍♂️ Персонаж</button>
        <button onclick="showQuests()">📜 Задания</button>
        <button onclick="showShop()">🛒 Лавка</button>
    </div>

    <!-- Окно боя -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-content">
            <h2 id="monster-name">Монстр</h2>
            <div class="monster-stats" id="monster-hp">HP: 10/10</div>
            <div class="monster-desc" id="monster-desc">Описание</div>
            <div class="battle-log" id="battle-log"></div>
            
            <!-- Инвентарь в бою -->
            <div id="battle-inventory" style="max-height: 150px; overflow-y: auto; margin-bottom: 10px; border: 1px solid #444; padding: 5px; border-radius: 5px;">
                <!-- Заполняется динамически -->
            </div>

            <div class="battle-buttons">
                <button class="battle-btn close-btn" onclick="closeBattle(true)">Отступить</button>
            </div>
        </div>
    </div>

    <!-- Окно инвентаря -->
    <div id="inventory-modal" class="modal-overlay">
        <div class="modal-content">
            <h2>Инвентарь</h2>
            <div id="inventory-list"></div>
            <button onclick="closeInventory()" style="width: 100%; margin-top: 15px; background: #6a2a2a;">Закрыть</button>
        </div>
    </div>

    <!-- Окно персонажа -->
    <div id="character-modal" class="modal-overlay">
        <div class="modal-content">
            <h2>Карточка персонажа</h2>
            <div style="text-align: center; font-size: 48px;" id="char-avatar">🧙‍♂️</div>
            <h3 id="char-name" style="text-align: center; color: #ffcc00;">Имя</h3>
            
            <p><b>Выберите аватар:</b></p>
            <div class="avatar-select" id="avatar-list"></div>

            <p><b>Уровень: <span id="char-level">1</span>/50</b></p>
            <div class="xp-bar-container">
                <div class="xp-bar-fill" id="xp-bar"></div>
                <div class="xp-text" id="xp-text">0 / 100 XP</div>
            </div>

            <button onclick="closeCharacter()" style="width: 100%; margin-top: 10px; background: #6a2a2a;">Закрыть</button>
        </div>
    </div>

    <!-- Окно Лавки -->
    <div id="shop-modal" class="modal-overlay">
        <div class="modal-content">
            <h2>🛒 Лавка Торговца</h2>
            <p style="text-align:center;">У вас есть: <b id="shop-crystals">0</b> 💎</p>
            <div id="shop-list"></div>
            <button onclick="closeShop()" style="width: 100%; margin-top: 15px; background: #6a2a2a;">Закрыть</button>
        </div>
    </div>

    <!-- Окно Заданий -->
    <div id="quests-modal" class="modal-overlay">
        <div class="modal-content">
            <h2>📜 Доска заданий</h2>
            <p style="text-align:center; font-size: 12px; color: #aaa;">Отправьте задание на подтверждение партнеру и получите билетики!</p>
            <div id="quests-list"></div>
            <button onclick="closeQuests()" style="width: 100%; margin-top: 15px; background: #6a2a2a;">Закрыть</button>
        </div>
    </div>

    <!-- Окно Кассы -->
    <div id="cashier-modal" class="modal-overlay">
        <div class="modal-content">
            <h2>🎪 Касса</h2>
            <p style="text-align:center;">У вас есть: <b id="cashier-tickets">0</b> 🎫</p>
            <div id="cashier-list"></div>
            <button onclick="closeCashier()" style="width: 100%; margin-top: 15px; background: #6a2a2a;">Закрыть</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAaA67URrVAeCBHQGVKxcTHd65ggnwOStU",
            authDomain: "magic-duo.firebaseapp.com",
            databaseURL: "https://magic-duo-default-rtdb.firebaseio.com",
            projectId: "magic-duo",
            storageBucket: "magic-duo.firebasestorage.app",
            messagingSenderId: "194532347648",
            appId: "1:194532347648:web:48542437a83b225045ede5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        window.gameDB = { db, ref, set, onValue, update, get };
        
        const script = document.createElement('script');
        script.src = 'script.js';
        document.body.appendChild(script);
    </script>
</body>
</html>
